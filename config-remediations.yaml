  CloudTrailValidationRemediation:
    Type: "AWS::Config::RemediationConfiguration"
    Condition: EnableCloudTrailValidationRem
    Properties:
      ConfigRuleName: "CloudTrailLogFileValidationEnabled"
      Automatic: True
      Parameters:
        AutomationAssumeRole:
          StaticValue:
            Values: 
